# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  GRADLEW: 'gradlew{{if eq OS "windows"}}.bat{{end}}'

tasks:
  check:
    desc: Check Non-Kotlin Files
    aliases: [prettier:check]
    cmds:
      - prettier --check .
      - yamllint -c .github/yamllint.yaml .
      - actionlint -shellcheck="-e SC2129"
      - shellcheck .github/scripts/prepare.sh

  format:
    desc: Format Non-Kotlin Files
    aliases: [prettier, prettier:write]
    cmds:
      - prettier --write .

  lint:
    desc: Gradle Lint
    cmd: "{{.GRADLEW}} lint {{.CLI_ARGS}}"

  compile:
    desc: Compile Kotlin
    cmd: "{{.GRADLEW}} :app:compileDebugKotlin {{.CLI_ARGS}}"

  debug:
    desc: Build Debug (recommended android studio)
    cmd: "{{.GRADLEW}} assembleDebug {{.CLI_ARGS}}"

  release:
    desc: Build Release APK
    cmd: "{{.GRADLEW}} assembleRelease {{.CLI_ARGS}}"

  bundle:
    desc: Build Android App Bundle
    cmd: "{{.GRADLEW}} bundleRelease {{.CLI_ARGS}}"

  gradle-status:
    desc: Gradle daemon status
    cmd: "{{.GRADLEW}} --status"

  gradle-stop:
    desc: Stop Gradle daemons
    cmd: "{{.GRADLEW}} --stop"
